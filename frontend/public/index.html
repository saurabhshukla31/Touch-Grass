<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#08080A" />
    <meta
      name="description"
      content="Touch Grass — a calm navigation utility."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Touch Grass" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <style>
      html,
      body {
        background: #08080a;
        color: #fff;
        margin: 0;
      }
      #root {
        background: #08080a;
      }
    </style>
    <title>Touch Grass</title>
    <script>
      window.addEventListener(
        "error",
        function (e) {
          if (
            e.error instanceof DOMException &&
            e.error.name === "DataCloneError" &&
            e.message &&
            e.message.includes("PerformanceServerTiming")
          ) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        },
        true,
      );
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>
      eruda.init();

      requestAnimationFrame(function pinTopRight() {
        var container = document.getElementById("eruda");
        if (container && container.shadowRoot) {
          var btn = container.shadowRoot.querySelector(".eruda-entry-btn");
          if (btn) {
            btn.style.setProperty("top", "20px", "important");
            btn.style.setProperty("right", "20px", "important");
            btn.style.setProperty("bottom", "auto", "important");
            btn.style.setProperty("left", "auto", "important");
            return;
          }
        }
        setTimeout(pinTopRight, 50);
      });
    </script>
  </body>
</html>
